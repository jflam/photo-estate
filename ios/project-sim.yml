# The app alone, for a Simulator older than the system upload extension needs (iOS 27): no extension,
# no Uploads screen. Everything else is the real app, the Inbox and its in-app uploader included.
#   xcodegen -s project-sim.yml && xcodebuild -project PhotoEstateSim.xcodeproj -scheme PhotoEstate \
#     -sdk iphonesimulator -derivedDataPath build SERVER_BASE=http://127.0.0.1:8791 build
name: PhotoEstateSim
options:
  bundleIdPrefix: com.jflam
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # Which build this is, shown in the app's settings. `deploy.sh` counts it up; 0 is a build made by hand.
    CURRENT_PROJECT_VERSION: 0
    SERVER_BASE: http://127.0.0.1:8791
targets:
  PhotoEstate:
    type: application
    platform: iOS
    sources:
      - path: PhotoEstate
        excludes: [UploadsView.swift, Info.plist]
      - path: Shared
    info:
      path: build/sim-Info.plist
      properties:
        CFBundleDisplayName: Photo Estate
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSPhotoLibraryUsageDescription: Photo Estate uploads the photos and videos you take to your own server.
        BackgroundUploadURLBase: $(SERVER_BASE)
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jflam.photoestate
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: NO_BACKGROUND_UPLOAD
