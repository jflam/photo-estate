# Checks every pull request and every push to main: the lockfile is current, ruff finds nothing, pyright
# finds no type errors, and the fast tests pass. Those run from photo-estate/, against
# photo-estate/pyproject.toml and uv.lock. Then the web pages' script modules (photo-estate/app/*.js,
# issue #89): TypeScript checks their JSDoc types (tsc --noEmit --allowJs --checkJs, from
# app/tsconfig.json) and Node's own test runner runs their unit tests (app/tests/*.test.js). Those run
# from photo-estate/app, against its package.json and package-lock.json: TypeScript, pinned, is the only
# package, and nothing of it is shipped (the browser loads the modules as they are).
#
# Three kinds of job, side by side, and one that answers for them all:
#   tests    the lockfile, ruff, pyright, the fast tests without the models, and the script modules.
#   models   tests/test_specs.py: TLC on the TLA+ models in specs/, the two long models each on a runner of
#            its own with every core, the rest together on a third. Only when their result could differ:
#            TLC reads nothing but specs/, so a pull request that changes neither specs/ nor what runs them
#            (tests/test_specs.py, tests/conftest.py, this file) skips them. A change to modelled code cannot
#            slip by that way: tests/test_machines.py (in `tests`) fails until its entry in
#            specs/machines.toml is stamped again, and that file is in specs/. Every push to main runs them.
#   ci       passes when `tests` passed and `models` passed or was skipped. It is the one check a branch
#            rule needs to require, whatever jobs there are.
#
# Left out on purpose (run them on a machine that has them: `uv run pytest` runs everything):
#   - the slow tests (`-m slow`): they start the real app, whose environment brings torch and
#     transformers, and two of them need the SigLIP 2 search model. CI never downloads the model and
#     never reaches the Mac mini or a real library: it sees only the checked-in demo library.
#
#   - the pages in a browser: the modules' logic is tested without one; tests/test_pages.py (fast tier)
#     checks that every page imports only modules and names that exist and that the servers send them
#     as JavaScript.
#
# Type checks (issue #90): pyright in basic mode, configured in pyproject.toml's [tool.pyright] (every
# module of the app; not tests/ or tools/). The pyright package fetches its own Node.js on first run.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  HF_HUB_OFFLINE: "1"

defaults:
  run:
    working-directory: photo-estate

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      models: ${{ steps.models.outputs.run }}
    steps:
      - name: Do the models need checking?
        id: models
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL: ${{ github.event.pull_request.number }}
        run: |
          run=true      # a push to main, or a list of files that could not be read: check them
          if [ "$EVENT" = pull_request ] && files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL/files" --paginate --jq '.[].filename'); then
            grep -qE '^(photo-estate/specs/|photo-estate/tests/(test_specs|conftest)\.py$|\.github/workflows/ci\.yml$)' <<<"$files" || run=false
          fi
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: photo-estate/uv.lock
      - name: exiftool (test_poc checks EXIF with it, and skips those checks without it)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Install the dev environment (dev group, from uv.lock)
        run: uv sync --locked --group dev
      - name: Lint (ruff)
        run: uv run --locked ruff check .
      - name: Type check (pyright)
        run: uv run --locked pyright
      - name: Fast tests (the models in specs/ are the `models` jobs)
        run: uv run --locked pytest -m "not slow" --ignore=tests/test_specs.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: photo-estate/app/package-lock.json
      - name: Install TypeScript (from app/package-lock.json)
        working-directory: photo-estate/app
        run: npm ci
      - name: Type check the script modules (tsc --noEmit --allowJs --checkJs)
        working-directory: photo-estate/app
        run: npm run typecheck
      - name: Unit tests of the script modules (node --test)
        working-directory: photo-estate/app
        run: npm test

  models:
    needs: changes
    if: needs.changes.outputs.models == 'true'
    name: models (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every config is in exactly one: a model's name picks its own, and the last takes what is left
        # (a new model too, until it is long enough to want a runner of its own).
        include:
          - name: PhoneReplica
            pick: PhoneReplica
          - name: PhoneGate
            pick: PhoneGate
          - name: the rest
            pick: not PhoneReplica and not PhoneGate
    env:
      REQUIRE_TLC: "1"   # tests/test_specs.py fails, instead of skipping, when TLC cannot run
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: photo-estate/uv.lock
      - name: Install the dev environment (dev group, from uv.lock)
        run: uv sync --locked --group dev
      - name: TLC, the TLA+ model checker (Java is on the runner)
        run: |
          mkdir -p ~/.local/share/tlaplus
          curl -fsSL -o ~/.local/share/tlaplus/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $HOME/.local/share/tlaplus/tla2tools.jar" | sha256sum -c -
      - name: Check the models
        env:
          PICK: ${{ matrix.pick }}
        run: uv run --locked pytest tests/test_specs.py -k "$PICK" --durations=5

  ci:
    needs: [changes, tests, models]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The tests passed, and the models passed or did not need checking
        working-directory: .
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.tests.result }}
          MODELS: ${{ needs.models.result }}
        run: |
          echo "changes: $CHANGES, tests: $TESTS, models: $MODELS"
          [ "$CHANGES" = success ] && [ "$TESTS" = success ] && { [ "$MODELS" = success ] || [ "$MODELS" = skipped ]; }
