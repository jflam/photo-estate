# One manifest and one lockfile (uv.lock, next to this file) for the photo-estate scripts.
#
# The scripts still carry their own PEP 723 `# /// script` headers, and `uv run embed.py` (or any other
# script with a header) still builds that script's own environment and ignores this file: the
# lightweight entry points stay as fast as they were. This file is for development: `uv sync` makes one
# locked environment with the groups below, which the test runner (pytest), the linter (ruff) and the
# type checker (pyright) use, and which CI builds with `uv sync --locked`.
#
# The groups follow the scripts' headers:
#   core    estate.py, scores.py, upload/stacks tests: pillow, HEIC support, numpy
#   ml      embed.py and the search model (torch, transformers); includes core
#   faces   faces.py (onnxruntime); includes core
#   places  places.py (offline reverse geocoding and time zones); includes core
#   tools   tools/: the book, the benchmarks, screenshots, the aesthetics experiments
#   dev     pytest, ruff and pyright, plus core so the fast tests run in this environment (the default group),
#           and Playwright for the browser tests of the slow tier (the package only: no browser is downloaded)
#
#   uv sync                          # dev (+ core): enough for `uv run pytest -m "not slow"`, ruff and pyright
#   uv sync --group ml --group faces --group places   # everything the server can use
#   uv lock                          # after changing a group; commit uv.lock

[project]
name = "photo-estate"
version = "0"
description = "A family's photo library: scripts, a plain HTTP server and SQLite."
# The scripts say ">=3.11" or ">=3.11,<3.14"; the ML ones (torch, onnxruntime) need the upper bound,
# so the locked environment uses the narrower of the two.
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
core = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pillow-heif>=0.18",
]
ml = [
    { include-group = "core" },
    "torch>=2.2",
    "transformers>=4.49",
    "sentencepiece",
    "protobuf",
    "av>=14",              # video.py: frames out of videos (it carries its own FFmpeg)
]
faces = [
    { include-group = "core" },
    "onnxruntime>=1.17",
]
places = [
    { include-group = "core" },
    "reverse_geocode>=1.6",
    "timezonefinder",
    "pycountry",
]
tools = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pygments>=2.17",
    "httpx[http2]",
    "requests",
    "playwright",
    "scipy",
    "scikit-learn",
]
dev = [
    { include-group = "core" },
    "av>=14",              # tests/test_video.py makes its own small videos and reads them back
    "pytest>=8.3",
    "ruff>=0.15",
    "pyright>=1.1.400",
    "playwright",          # tests/test_pages_browser.py (slow tier); skipped when it has no Chromium to run
]

[tool.uv]
package = false            # a folder of scripts, not an installable package

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytester runs pytest inside a test: tests/test_harness.py uses it to check the runner itself.
addopts = ["-ra", "--strict-markers", "-p", "pytester"]
markers = [
    "legacy: a self-running script in tests/, run whole as a subprocess (see tests/conftest.py)",
    "slow: needs the ML stack or takes minutes; left out of CI with -m \"not slow\"",
    "server: starts the real app (embed.py serve --demo), whose environment has torch and transformers",
    "model: needs the SigLIP 2 search model in the Hugging Face cache",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["demo", "app/node_modules"]

[tool.ruff.lint]
# Conservative on purpose: syntax errors and pyflakes (undefined names, unused imports and variables,
# redefinitions), which the code passes today. Style rules and `ruff format` are not enforced: the
# code has its own compact style, and reformatting it would bury every real change in a diff.
select = ["E9", "F"]

[tool.pyright]
# Static type checks (issue #90): `uv run pyright` from here; CI runs it. Basic mode, on every module of the
# app and its scripts (the folder, intake/ and core/). Left out: tests/ and tools/ (scripts that drive
# the app from outside), and demo/. The optional groups (ml: torch, transformers; faces: onnxruntime;
# places: reverse_geocode, timezonefinder, pycountry) are not in the dev environment, so their few
# imports carry a narrow `# pyright: ignore[reportMissingImports]` and their objects are untyped.
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["."]
exclude = ["tests", "tools", "demo", "**/node_modules", "**/__pycache__", "**/.*"]
