<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Estate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Estate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)">
<style>
/*@estate.css*/
/* The web app is laid out as the iPhone app is (ios/PhotoEstate): two places, the Library (every photo in time
   order, zoomed out to a card a year or a card a month) and Search (finding some of them), a tab bar between
   them, and the same viewer. Phones: the page only ever scrolls up and down, and nothing zooms the page
   (photos zoom in the viewer). */
html { scrollbar-gutter: stable; touch-action: pan-x pan-y; overflow-anchor: none; }
body { min-height: 100dvh; }
:root { --bar: 62px; --tabs: calc(84px + env(safe-area-inset-bottom)); }

/* glass: controls floating over photos */
.glass { background: color-mix(in srgb, var(--raised) 72%, transparent); -webkit-backdrop-filter: blur(22px) saturate(1.6);
  backdrop-filter: blur(22px) saturate(1.6); box-shadow: 0 0 0 .5px var(--line-2), 0 6px 22px rgba(30,20,5,.12); }
@media (prefers-color-scheme: dark) { .glass { background: rgba(44,44,47,.62); box-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 6px 22px rgba(0,0,0,.4); } }
.caps { display: flex; align-items: center; border-radius: 999px; padding: 0 2px; }
.caps .round { width: 42px; height: 40px; border-radius: 999px; color: var(--ink); }

/* ── tab bar ────────────────────────────────────────────────────────── */
.tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 0 calc(18px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  pointer-events: none; }
.tabbar > * { pointer-events: auto; }
.tabbar .tb { height: 56px; padding: 0 22px; border-radius: 999px; display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 1px; font-size: 11px; font-weight: 600; color: var(--ink); transition: color .15s, transform .2s var(--ease); }
.tabbar .tb svg { width: 24px; height: 24px; }
.tabbar .tb.ts { width: 56px; padding: 0; }
.tabbar .tb.on { color: var(--sun); }
.tabbar .tb:active { transform: scale(.95); }
.tabbar .lib { padding: 4px; border-radius: 999px; }
.tabbar .lib .tb { height: 48px; padding: 0 18px; }
.tabbar .lib .tb.on { background: var(--well); }
.v.on ~ .tabbar { display: none; }

/* ── the Library's bar, floating over the photos ────────────────────── */
.lbar { position: fixed; z-index: 15; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left)); pointer-events: none; }
.lbar::before { content: ""; position: absolute; inset: 0 0 -18px; z-index: -1; pointer-events: none;
  background: linear-gradient(var(--paper), color-mix(in srgb, var(--paper) 85%, transparent) 60%, transparent); }
.lbar > * { pointer-events: auto; }
.lbar .sp { flex: 1; pointer-events: none; }
.scale { display: flex; padding: 3px; border-radius: 999px; }
.scale button { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14.5px; font-weight: 500; color: var(--ink);
  transition: background .2s var(--ease), color .2s; }
.scale button.on { background: var(--sun-lit); color: var(--on-sun); }
.lbar .back { width: 40px; height: 40px; border-radius: 50%; color: var(--ink); display: grid; place-items: center; }

/* ── page heading and the grid ──────────────────────────────────────── */
main { padding: 0 0 calc(var(--tabs) + 40px); overflow-x: clip; }
#libTab main, #albTab main, .periods { padding-top: calc(var(--bar) + env(safe-area-inset-top)); }
.head { padding: 14px var(--pad) 6px; }
.head h1 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -.025em; overflow-wrap: anywhere; }
.head p { margin-top: 3px; color: var(--muted); font-size: 15px; }
.grid { transition: opacity .2s; }
.grid.stale { opacity: .45; }
.grid.fresh { animation: rise .45s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.grid section { padding-top: 22px; }
.grid section.flat { padding-top: 14px; }
.sh { padding: 0 var(--pad) 9px; }
.sh h2 { font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
.sh p { margin-top: 1px; min-height: 18px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh .where:not(:empty) + .n:not(:empty)::before { content: "  ·  "; white-space: pre; }
.rows { padding: 0 var(--gpad); }
.row { display: flex; gap: var(--gap); margin-bottom: var(--gap); content-visibility: auto; }
.t { position: relative; flex: none; height: 100%; overflow: hidden; background: var(--tile); cursor: pointer;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.t img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .18s, filter .25s; }
.t img.in { opacity: 1; }
.t:hover img { filter: brightness(1.06); }
.t .fv { position: absolute; top: 6px; right: 6px; color: var(--sun-lit); filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.t .stk { position: absolute; top: 6px; left: 6px; display: flex; align-items: center; gap: 4px; padding: 2px 7px 2px 5px; border: 0;
  border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font: 600 12px/18px inherit; font-variant-numeric: tabular-nums; cursor: pointer; }
.t .stk:hover, .t .stk:focus-visible { background: rgba(0,0,0,.8); }
.t .cap { position: absolute; inset: auto 0 0 0; padding: 24px 10px 7px; font-size: 12px; font-weight: 600; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.55)); opacity: 0; transition: opacity .2s; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.t:hover .cap { opacity: 1; }
/* ghosts: a list laid out before its photos are known, every tile the shape its photo will be */
.grid.ghost .t { cursor: default; }
.grid.ghost .rows { animation: breathe .9s .25s ease-in-out infinite alternate; }
@keyframes breathe { to { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .grid.ghost .rows { animation: none; } }
.sentinel { height: 1px; }
/* a month, opened from its card: its photos and nothing else; under them, the months either side */
/* albums: sets of photos, made here or brought in with the photos */
.card .badge { position: absolute; z-index: 1; right: 12px; bottom: 12px; height: 26px; padding: 0 10px; border-radius: 999px; display: inline-flex; align-items: center;
  background: rgba(0,0,0,.55); font-size: 12.5px; font-weight: 600; }
.head .why { margin-top: 8px; max-width: 70ch; font-style: italic; color: var(--ink-2); font-size: 15px; }
.head .why:empty { display: none; }
.srcs { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 var(--cpad); }
.periods .bt { margin-top: 34px; }
.t .hid { position: absolute; left: 6px; bottom: 6px; padding: 1px 8px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 600; }
.monnav { display: flex; gap: 12px; padding: 30px max(var(--gpad), 14px) 0; }
.monnav span { flex: 1; }
.monnav button { height: 44px; padding: 0 18px; border-radius: 999px; background: var(--well); display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
.monnav button:hover { background: var(--well-2); }
.monnav svg { color: var(--muted); }
:root { --gpad: var(--pad); }
@media (max-width: 760px) { :root { --gpad: 0px; } }       /* phones: the photos run to the edges, as on the iPhone */

/* ── Years and Months: a card each ──────────────────────────────────── */
.periods { padding-bottom: calc(var(--tabs) + 30px); }
.cards { display: grid; gap: 12px; padding: 4px var(--cpad) 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.cards.years { gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); }
:root { --cpad: max(14px, calc(var(--pad) - 6px)); }
.periods .head { padding-left: calc(var(--cpad) + 2px); padding-right: var(--cpad); padding-bottom: 8px; }
.card { position: relative; display: block; width: 100%; height: 210px; border-radius: 18px; overflow: hidden; background: var(--well);
  text-align: left; color: #fff; transition: transform .18s var(--ease); scroll-margin-top: calc(var(--bar) + env(safe-area-inset-top) + 6px); }
.years .card { height: 300px; border-radius: 22px; }
.cards .yr { grid-column: 1 / -1; margin: 14px 2px 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; scroll-margin-top: calc(var(--bar) + env(safe-area-inset-top) + 6px); }   /* Months: each year starts its own row, so a year's months are never beside another's */
.cards .yr:first-child { margin-top: 0; }
.card:active { transform: scale(.97); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.card img.in { opacity: 1; }
.card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.5), transparent 50%); }
.card .ct { position: absolute; z-index: 1; left: 16px; right: 16px; top: 14px; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
.card b { display: block; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.years .card b { font-size: 34px; }
.card small { display: block; margin-top: 2px; font-size: 15px; font-weight: 500; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small + small { font-weight: 400; opacity: .85; margin-top: 0; }
.card:hover img.in { filter: brightness(1.05); }

/* the handle at the right edge: where you are in the library; drag it to go anywhere */
.scrub { position: fixed; z-index: 14; right: calc(8px + env(safe-area-inset-right)); top: 0; height: 38px; padding: 0 8px 0 15px;
  display: flex; align-items: center; gap: 8px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .3s, height .18s, transform .18s var(--ease); touch-action: none; cursor: grab; }
.scrub.on { opacity: 1; pointer-events: auto; }
.scrub.drag { height: 44px; cursor: grabbing; transform: translateX(-4px); }
.scrub svg { color: var(--muted); }
.scrub span:empty { display: none; }

/* ── Search: the field, always at the top; under it, the filters of whatever is showing ── */
.sbar { position: sticky; top: 0; z-index: 15; padding: calc(8px + env(safe-area-inset-top)) 0 10px;
  background: color-mix(in srgb, var(--paper) 88%, transparent); -webkit-backdrop-filter: saturate(1.5) blur(20px); backdrop-filter: saturate(1.5) blur(20px); }
.srow { display: flex; align-items: center; gap: 8px; padding: 0 calc(var(--cpad) + env(safe-area-inset-right)) 0 calc(var(--cpad) + env(safe-area-inset-left)); }
.srow .round { width: 38px; height: 44px; border-radius: 12px; color: var(--ink); flex: none; }
.search { position: relative; flex: 1 1 0; min-width: 0; height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 12px 0 15px;
  border-radius: 999px; background: var(--well); transition: box-shadow .18s, background .18s; cursor: text; }
.search:focus-within { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 4px var(--sun-wash); }
.search > svg { color: var(--muted); }
.search input { flex: 1 1 0; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 16px; }
.search input::-webkit-search-cancel-button { display: none; }
.search .qx { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--muted); color: var(--paper); flex: none; }
.search kbd { flex: none; }
.search:focus-within kbd { display: none; }
#sCancel { flex: none; color: var(--sun); font-weight: 500; padding: 0 4px; height: 44px; }
.chips { display: flex; gap: 8px; margin-top: 10px; padding: 0 var(--cpad); overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; background: var(--well);
  font-weight: 500; font-size: 14.5px; white-space: nowrap; max-width: 260px; transition: background .15s, transform .2s var(--ease); }
.chip > span { overflow: hidden; text-overflow: ellipsis; }
.chip:hover { background: var(--well-2); }
.chip:active { transform: scale(.97); }
.chip.on { background: var(--sun-lit); color: var(--on-sun); }
.chip .x { width: 18px; height: 18px; display: grid; place-items: center; margin-right: -4px; opacity: .7; }
.chip.on svg.h { fill: currentColor; }
.notice { margin: 8px calc(var(--cpad) + 2px) 0; font-size: 13.5px; color: var(--muted); }
.notice:empty { display: none; }
.notice button { color: var(--sun); font-weight: 500; }
#results .head { padding-top: 12px; }

/* suggestions while typing */
.sugs { padding: 6px 0 calc(var(--tabs) + 20px); }
.srw { width: 100%; display: flex; align-items: center; gap: 14px; padding: 11px calc(var(--cpad) + 2px); text-align: left; }
.srw:hover, .srw.cur { background: var(--well); }
.srw > svg { width: 26px; color: var(--sun); }
.srw span { min-width: 0; flex: 1; }
.srw b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srw small { display: block; color: var(--muted); font-size: 13px; }
.srw { position: relative; }
.srw + .srw::before { content: ""; position: absolute; top: 0; right: 0; left: calc(var(--cpad) + 42px); height: 1px; background: var(--line); }

/* Search with nothing asked: the threads to pull */
.browse { padding: 8px 0 calc(var(--tabs) + 40px); display: flex; flex-direction: column; gap: 30px; }
.strip { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 var(--cpad); overscroll-behavior-x: contain; scroll-snap-type: x proximity; }
.strip::-webkit-scrollbar { display: none; }
.strip > * { flex: none; scroll-snap-align: start; scroll-margin-left: var(--cpad); }
.idea { height: 38px; padding: 0 14px; border-radius: 999px; background: var(--well); display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 14.5px; }
.idea svg { color: var(--sun); }
.idea:hover, .th:hover { background: var(--well-2); }
.bt { display: flex; align-items: baseline; justify-content: space-between; padding: 0 calc(var(--cpad) + 2px); margin-bottom: 12px; }
.bt h2 { font-size: 24px; font-weight: 700; letter-spacing: -.022em; }
.bt button { color: var(--sun); font-size: 15px; }
.trip { position: relative; width: 220px; height: 290px; border-radius: 22px; overflow: hidden; background: var(--well); text-align: left; color: #fff; }
.trip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s; }
.trip img.in { opacity: 1; }
.trip .ct { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 14px 14px; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
.trip b { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-size: 19px; line-height: 1.2; font-weight: 600; }
.trip small { display: block; margin-top: 3px; font-size: 12px; opacity: .8; }
.strip.trips { gap: 12px; }
.years-bars { display: flex; align-items: flex-end; height: 118px; padding: 0 calc(var(--cpad) + 2px); }
.years-bars button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; gap: 6px; height: 100%; padding: 0 3px; }
.years-bars.tight button { padding: 0 1.5px; }
.years-bars i { display: block; border-radius: 3px; background: var(--sun); transition: filter .15s; }
.years-bars button:hover i { filter: brightness(1.15); }
.years-bars small { height: 12px; font-size: 10px; line-height: 12px; font-weight: 500; color: var(--muted); text-align: center; white-space: nowrap; overflow: visible; }
.favs { display: flex; align-items: center; gap: 14px; margin: 0 var(--cpad); padding: 16px; border-radius: 20px; background: var(--well); text-align: left; }
.favs:hover { background: var(--well-2); }
.favs > svg:first-child { color: var(--sun); width: 22px; height: 22px; }
.favs span { flex: 1; }
.favs b { display: block; font-size: 19px; font-weight: 600; }
.favs small { color: var(--muted); font-size: 13px; }
.favs > svg:last-child { color: var(--faint); }
.th { height: 42px; padding: 0 14px; border-radius: 999px; background: var(--well); display: inline-flex; align-items: center; gap: 7px; font-weight: 500; font-size: 14.5px; }
.th small { color: var(--muted); font-size: 13px; font-weight: 400; font-variant-numeric: tabular-nums; }

/* ── menus, and the sheet behind a filter chip (a popover on a wide screen) ── */
.menu, .sheet { position: fixed; z-index: 40; background: var(--raised); box-shadow: var(--shadow); }
.menu { width: 270px; padding: 6px; border-radius: 20px; transform-origin: calc(100% - 20px) 0; animation: pop .18s var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.97); } }
.menu h5 { margin: 8px 12px 3px; font-size: 12px; font-weight: 500; color: var(--muted); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 6px 4px; }
.mi { width: 100%; display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 13px; text-align: left; font-size: 15px; }
.mi:hover { background: var(--well); }
.mi > svg:first-child { width: 18px; color: var(--sun); visibility: hidden; }
.mi.on > svg:first-child { visibility: visible; }
.mi span { flex: 1; }
.mi .sw { width: 36px; height: 22px; }
.mi .sw::after { width: 18px; height: 18px; }
.mi .sw.on::after { transform: translateX(14px); }
.mi.ln > svg:first-child { visibility: visible; color: var(--ink-2); }
.menu .mk { padding: 0 6px 6px; display: grid; gap: 10px; }
.menu .mk h5 { margin: 8px 6px -4px; }
.menu .mk input { width: 100%; }
.menu .mk .err { margin: 0 6px; font-size: 13.5px; color: var(--no); }
.menu .mk .err:empty { display: none; }
.menu .mk .btn { justify-self: end; }

.scrim { position: fixed; inset: 0; z-index: 39; background: rgba(0,0,0,.28); animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet { display: flex; flex-direction: column; }
.sheet.pop { width: 380px; max-height: min(560px, calc(100dvh - 120px)); border-radius: 22px; animation: pop .18s var(--ease); transform-origin: 30px 0; }
.sheet.low { left: 0; right: 0; bottom: 0; max-height: 86dvh; height: 62dvh; border-radius: 28px 28px 0 0; padding-bottom: env(safe-area-inset-bottom);
  animation: up .28s var(--ease); }
.sheet.low.tall { height: 86dvh; }
@keyframes up { from { transform: translateY(100%); } }
.sheet.low::before { content: ""; display: block; flex: none; width: 36px; height: 5px; margin: 8px auto 0; border-radius: 3px; background: var(--line-2); }
.sh-top { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 10px 4px; }
.sh-top b { font-weight: 600; }
.sh-top button { justify-self: start; height: 36px; padding: 0 8px; color: var(--sun); }
.sh-top .done { justify-self: end; font-weight: 600; }
.sh-tools { flex: none; padding: 6px 12px 6px; display: flex; flex-direction: column; gap: 8px; }
.sh-tools .seg button { flex: 1; }
.sh-tools input { width: 100%; height: 38px; font-size: 16px; }
.sh-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 6px 10px; scrollbar-width: thin; }
.op { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 8px 12px; border-radius: 13px; text-align: left; }
.op:hover { background: var(--well); }
.op span { flex: 1; min-width: 0; }
.op b { display: block; font-size: 17px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op small { display: block; color: var(--muted); font-size: 13px; }
.op .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.op .ck { width: 16px; color: var(--sun); opacity: 0; }
.op.on .ck { opacity: 1; }
.op.zero { opacity: .5; }
.op img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--tile); flex: none; }
.op.yr b { font-size: 20px; font-weight: 600; }
.op .ex { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); transition: transform .2s var(--ease); }
.op .ex.open { transform: rotate(90deg); }
.op.mo { padding-left: 26px; min-height: 44px; }
.op.mo b { font-size: 16px; font-weight: 400; }
.none { padding: 30px 10px; color: var(--muted); text-align: center; }

/* ── viewer: always the dark room, whatever the page is ─────────────── */
.v { position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden; color: #f4f2ee;
  --vwell: rgba(255,255,255,.075); --vwell-2: rgba(255,255,255,.13); --vmuted: #8f8c85;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.v.on { display: block; }
.v-bg { position: absolute; inset: 0; background: #050505; }
.v-stage { position: absolute; inset: 0; pointer-events: none; will-change: transform; }   /* the photo and its neighbours, a page apart */
.v-pic { position: absolute; left: 0; top: 0; pointer-events: auto; overflow: hidden; background: #111; transform-origin: 0 0; will-change: transform; }
.v-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.v-pic .hi { opacity: 0; }                          /* fades in; goes at once, so an emptied one never shows */
.v-pic .hi.in { opacity: 1; transition: opacity .3s; }
.v-ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .25s; }
.v-ui > * { pointer-events: auto; }
.v-ui::before, .v-ui::after { content: ""; position: absolute; left: 0; right: 0; pointer-events: none; transition: opacity .25s; }
.v-ui::before { top: 0; height: calc(110px + env(safe-area-inset-top)); background: linear-gradient(rgba(0,0,0,.55), transparent); }
.v-ui::after { bottom: 0; height: calc(130px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.5)); }
.vglass { background: rgba(60,58,55,.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5);
  box-shadow: 0 0 0 .5px rgba(255,255,255,.12); }
.v-btn { position: absolute; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #f4f2ee;
  transition: background .15s, opacity .2s, transform .2s var(--ease); }
.v-btn svg { width: 18px; height: 18px; }
.v-btn:hover { background: rgba(110,106,100,.6); }
.v-btn:active { transform: scale(.94); }
#vClose { top: calc(12px + env(safe-area-inset-top)); left: calc(14px + env(safe-area-inset-left)); }
.v-title { position: absolute; top: calc(17px + env(safe-area-inset-top)); left: 74px; right: 74px; text-align: center; pointer-events: none; transition: opacity .2s, right .3s var(--ease); }
.v-title b, .v-title span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.v-title b { font-size: 17px; line-height: 22px; font-weight: 600; color: #fff; }
.v-title span { font-size: 12px; line-height: 16px; color: rgba(255,255,255,.75); }
.v-bar { position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 4px;
  padding: 0 6px; border-radius: 999px; transition: left .3s var(--ease), opacity .2s; }
.v-bar button { width: 62px; height: 50px; display: grid; place-items: center; color: #fff; border-radius: 999px; transition: background .15s; }
.v-bar button:hover { background: rgba(255,255,255,.1); }
.v-bar svg { width: 21px; height: 21px; }
.v-bar button.on { color: #ffb061; }
#vFavBtn.on svg { fill: currentColor; }
#vShare.busy svg { animation: pulse 1s ease-in-out infinite; }
#vShare.ready { color: #ffb061; }
@keyframes pulse { 50% { opacity: .35; } }
.v-note { position: absolute; left: 50%; bottom: calc(74px + env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 13px; color: rgba(255,255,255,.75); white-space: nowrap; }
.v-note:empty { display: none; }
/* the stack the photo is on top of: its shots as a row of small prints over the bar */
.v-strip { position: absolute; left: 50%; bottom: calc(68px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 5px;
  max-width: calc(100% - 28px); height: 58px; padding: 0 3px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; transition: left .3s var(--ease), opacity .2s; }
.v-strip::-webkit-scrollbar { display: none; }
.v-strip[hidden] { display: none; }
.v-strip button { position: relative; flex: none; width: 38px; height: 52px; border-radius: 7px; overflow: hidden; background: #222; opacity: .7; transition: width .2s var(--ease), opacity .2s; }
.v-strip button:hover { opacity: 1; }
.v-strip button.on { width: 46px; opacity: 1; }
.v-strip button.on::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 2px #fff; }
.v-strip img { width: 100%; height: 100%; object-fit: cover; }
.v.stacked .v-note { bottom: calc(132px + env(safe-area-inset-bottom)); }
#vPrev { left: 18px; top: 50%; margin-top: -23px; }
#vNext { right: 18px; top: 50%; margin-top: -23px; transition: right .3s var(--ease), opacity .2s; }

.v.bare .v-btn, .v.bare .v-title, .v.bare .v-bar, .v.bare .v-strip, .v.bare .v-note, .v.bare .v-ui::before, .v.bare .v-ui::after { opacity: 0; pointer-events: none; }

/* details: what is known about a photo, laid out like the back of a print */
.v-info { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; padding: 30px 20px calc(40px + env(safe-area-inset-bottom)); overflow-y: auto;
  background: #161617; transform: translateX(100%); transition: transform .3s var(--ease); touch-action: pan-y; -webkit-user-select: text; user-select: text;
  scrollbar-width: thin; scrollbar-color: #3a3936 transparent; overscroll-behavior: contain; }
.v.info .v-info { transform: none; }
.v.info #vNext { right: 378px; }

.v.info .v-strip { max-width: calc(100% - 388px); }

.v-info .sub { margin-top: 4px; color: var(--vmuted); font-size: 15px; }
.v-info .note { margin-top: 10px; font-style: italic; color: #bab7b0; }

.vcard { display: block; width: 100%; margin-top: 22px; border-radius: 18px; background: var(--vwell); text-align: left; overflow: hidden; }
button.vcard:hover { background: var(--vwell-2); }
.vrow { display: flex; align-items: center; gap: 14px; padding: 14px; width: 100%; text-align: left; }
.vrow > svg:first-child { width: 22px; color: #ffb061; flex: none; }
.vrow span { flex: 1; min-width: 0; }
.vrow b { display: block; font-size: 17px; font-weight: 600; color: #fff; }
.vrow small { display: block; margin-top: 2px; font-size: 13px; color: var(--vmuted); }
.vrow small a { color: inherit; text-decoration: underline; text-decoration-color: rgba(255,255,255,.25); text-underline-offset: 2px; }
.vrow > svg:last-child { width: 14px; color: #6b6964; flex: none; }
button.vrow:hover, .vcard > button.vrow:hover { background: var(--vwell-2); }
.vcard > .vrow { position: relative; }
.vcard > .vrow + .vrow::before { content: ""; position: absolute; top: 0; right: 0; left: 50px; height: 1px; background: rgba(255,255,255,.08); }
.v-info h4 { margin: 22px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--vmuted); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { height: 36px; padding: 0 14px; border-radius: 999px; background: var(--vwell); color: #f4f2ee; font-size: 14.5px; font-weight: 500; }
.tag:hover { background: var(--vwell-2); }
.plate { margin-top: 22px; padding: 14px; border-radius: 18px; background: var(--vwell); }
.plate .vrow { padding: 0; }
.plate button.vrow:hover { background: none; }
.plate button.vrow:hover b { text-decoration: underline; text-underline-offset: 3px; }
.exp { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 12px; }
.exp div { text-align: center; }

.exp small { display: block; margin-top: 3px; font-size: 9px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--vmuted); }
.v-info .file { margin: 22px 2px 0; font-size: 12px; line-height: 1.5; color: #6f6c66; overflow-wrap: anywhere; }

@media (pointer: coarse) {
  #vPrev, #vNext { display: none; }                 /* swipe instead */
  .t:hover img { filter: none; }
}
/* a phone held upright: details are a sheet from below; swipe up for it, down to put it away */
@media (max-width: 760px) {

    st = { tab: alb ? "albums" : location.search ? "search" : "library", s: alb ? "" : location.search.slice(1), alb: +p.get("album") || null }; }
  if (st.lib) libSet(st.lib);
  AL.id = st.alb ?? null;
  S = fromParams(new URLSearchParams(st.s ?? location.search)); stopTyping();
  setTab(st.tab || "library", "init", !!st.lib);       // an entry that says where the Library was: there, at its card or month
}
addEventListener("popstate", () => {
  if (VW.is("leaving")) { VW.to("closed"); return navFlush(); }   // the viewer closed itself; its entry has now been taken back
  if (viewing()) return closeViewer("gone");        // Back, or a swipe from the screen edge, closes the photo
  if (history.state?.v) return history.back();      // the entry left by a photo that is no longer open: step over it
  closeMenus();
  restore(history.state);
});
let lastW = 0;
new ResizeObserver(() => { const w = document.documentElement.clientWidth; if (w !== lastW) { lastW = w; for (const g of grids()) g.relayout(); } }).observe(document.documentElement);

history.scrollRestoration = "manual";               // the page puts you back where you were, card or month, itself
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});   // the "can't reach" page
(async function init() {
  INFO = await api("/api/info");                // the library's facts; its facet counts double as the first ones
  if (INFO.demo) q.placeholder = "Try: latte art, kitten, waterfall in autumn";
  buildVocab();
  const params = new URLSearchParams(location.search);
  S = fromParams(params); q.value = S.q;
  TAB = params.has("album") || params.has("albums") ? "albums" : [...params].length ? "search" : "library";
  if (TAB === "albums") { AL.id = +params.get("album") || null; S = blank(); }
  history.replaceState({ ...snap(), d: 0 }, "", url());
  libLoad();
  setTab(TAB, "init");
})();
</script>
