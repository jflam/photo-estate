<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Estate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo Estate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfbfa; --surface: #f1f1ef; --raised: #ffffff; --hover: rgba(0,0,0,.05);
  --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.14);
  --ink: #131314; --ink-2: #4b4b51; --muted: #86868d; --faint: #c9c9cd;
  --tile: #ececea; --seg: rgba(0,0,0,.06); --seg-on: #ffffff; --inv: #131314; --inv-ink: #ffffff; --fav: #e5484d;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 36px rgba(0,0,0,.14);
  --pad: 32px; --gap: 4px;
  --ease: cubic-bezier(.2,.7,.2,1);
  --sans: "Inter Variable", "Inter", "Adwaita Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c0c0d; --surface: #18181a; --raised: #1c1c1f; --hover: rgba(255,255,255,.06);
    --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
    --ink: #f1f1f2; --ink-2: #b7b7bc; --muted: #7d7d85; --faint: #45454b;
    --tile: #17171a; --seg: rgba(255,255,255,.06); --seg-on: rgba(255,255,255,.13); --inv: #f1f1f2; --inv-ink: #0c0c0d; --fav: #ff6b6b;
    --shadow: 0 0 0 1px rgba(0,0,0,.4), 0 16px 48px rgba(0,0,0,.55);
  }
}
* { box-sizing: border-box; }
/* Phones: the page only ever scrolls up and down. Text keeps its size in landscape, and nothing zooms the page
   (photos zoom in the viewer); a zoomed page is what leaves everything a few pixels off to one side. */
html { background: var(--bg); scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
body { margin: 0; color: var(--ink); font: 14px/1.4 var(--sans); letter-spacing: -.006em;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; flex: none; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ── header ─────────────────────────────────────────────────────────── */
header { position: sticky; top: 0; z-index: 10; padding: 16px var(--pad) 0;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter: saturate(1.5) blur(20px); backdrop-filter: saturate(1.5) blur(20px);
  box-shadow: 0 1px 0 transparent; transition: box-shadow .3s; overflow-x: clip; }
header.scrolled { box-shadow: 0 1px 0 var(--line); }
.bar { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.search { position: relative; flex: 1 1 340px; max-width: 540px; height: 40px; display: flex; align-items: center;
  gap: 10px; padding: 0 12px; border-radius: 10px; background: var(--surface);
  box-shadow: inset 0 0 0 1px transparent; transition: box-shadow .18s, background .18s; cursor: text; }
.search:focus-within { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 4px var(--hover); }
.search > svg { color: var(--muted); }
.search input { flex: 1 1 0; width: 0; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 14.5px; }
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { display: none; }
.search kbd { font: 500 11px var(--sans); color: var(--muted); border: 1px solid var(--line-2); border-radius: 5px;
  width: 20px; height: 20px; display: grid; place-items: center; transition: opacity .15s; }
.search:focus-within kbd { opacity: 0; }
.like { display: none; align-items: center; gap: 7px; height: 28px; padding: 0 4px 0 3px; margin-left: -4px;
  border-radius: 7px; background: var(--inv); color: var(--inv-ink); font-weight: 500; font-size: 13px; white-space: nowrap; }
.like.on { display: inline-flex; }
.like img { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; }
.like button { width: 20px; height: 20px; display: grid; place-items: center; opacity: .6; }
.like button:hover { opacity: 1; }

.pills { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.pill { height: 32px; padding: 0 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px;
  color: var(--ink-2); font-weight: 500; font-size: 13.5px; white-space: nowrap; max-width: 240px;
  transition: background .15s, color .15s; }
.pill > span { overflow: hidden; text-overflow: ellipsis; }
.pill svg { opacity: .55; transition: opacity .15s, transform .2s var(--ease); }
.pill:hover, .pill.open { background: var(--hover); color: var(--ink); }
.pill.open .chev { transform: rotate(180deg); }
.pill.on { background: var(--inv); color: var(--inv-ink); padding-right: 4px; animation: pillin .25s var(--ease); }
.pill.on .chev { display: none; }
.pill .x { display: none; width: 22px; height: 22px; border-radius: 6px; place-items: center; }
.pill.on .x { display: grid; }
.pill .x:hover { background: color-mix(in srgb, var(--inv-ink) 16%, transparent); }
.pill .x:hover svg { opacity: 1; }
.pill.fav.on svg { opacity: 1; color: var(--fav); fill: var(--fav); }
.pill.fav.on { padding-right: 10px; }
@keyframes pillin { from { transform: scale(.94); opacity: .6; } }
.tools { margin-left: auto; display: flex; gap: 2px; }
.icon { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-2);
  transition: background .15s, color .15s; }
.icon:hover, .icon.open { background: var(--hover); color: var(--ink); }

/* ── timeline ───────────────────────────────────────────────────────── */
.tl { position: relative; margin-top: 14px; padding-bottom: 10px; user-select: none; touch-action: none; cursor: crosshair; }
.tl-bars { display: flex; align-items: flex-end; height: 34px; color: var(--ink); }
.tl-bars i { flex: 1; height: 100%; min-width: 0; transform-origin: 50% 100%; transform: scaleY(0);
  background: currentColor; opacity: .26; transition: transform .5s var(--ease), opacity .25s; }
.tl.gapped .tl-bars i { margin-right: 1px; }
.tl-bars i.in { opacity: .92; }
.tl-bars i.hov { opacity: 1; }
.tl-years { position: relative; height: 16px; margin-top: 5px; border-top: 1px solid var(--line); }
.tl-years span { position: absolute; top: 4px; font-size: 10.5px; line-height: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; letter-spacing: .01em; padding-left: 4px; cursor: pointer; transition: color .15s; }
.tl-years span::before { content: ""; position: absolute; left: 0; top: -4px; height: 4px; width: 1px; background: var(--line-2); }
.tl-years span:hover, .tl-years span.in { color: var(--ink); }
.tl-sel { position: absolute; top: -4px; height: 43px; border-radius: 4px; background: var(--hover);
  box-shadow: inset 0 0 0 1px var(--line-2); opacity: 0; pointer-events: none;
  transition: opacity .2s, left .25s var(--ease), width .25s var(--ease); }
.tl-sel.on { opacity: 1; }
.tl.drag .tl-sel { transition: opacity .2s; }
.tl-here { position: absolute; top: 38px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%;
  background: var(--ink); opacity: 0; pointer-events: none; transition: left .3s var(--ease), opacity .3s; }
.tl-here.on { opacity: 1; }
.tl-tip { position: absolute; top: -27px; transform: translateX(-50%); padding: 3px 8px; border-radius: 6px;
  background: var(--inv); color: var(--inv-ink); font-size: 11.5px; font-weight: 500; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 2; }
.tl-tip.on { opacity: 1; }
.tl-tip b { font-weight: 500; opacity: .6; margin-left: 6px; }

/* ── page ───────────────────────────────────────────────────────────── */
main { padding: 26px var(--pad) 96px; overflow-x: clip; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; min-height: 58px; }
.head > div:first-child { min-width: 0; }
.head h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 600; letter-spacing: -.028em;
  display: flex; align-items: center; gap: 12px; overflow-wrap: anywhere; }
.head h1 img { flex: none; }
.head h1 img { width: 36px; height: 36px; border-radius: 6px; object-fit: cover; }
.head p { margin: 5px 0 0; color: var(--muted); font-size: 13.5px; }
.head p b { font-weight: 500; color: var(--ink-2); }
.head p i { font-style: normal; color: var(--faint); margin: 0 7px; }
.head-r { display: flex; flex: none; gap: 2px; padding-bottom: 1px; }
.txt { height: 28px; padding: 0 9px; border-radius: 7px; color: var(--muted); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; transition: background .15s, color .15s; }
.txt:hover { background: var(--hover); color: var(--ink); }
#grid { transition: opacity .2s; }
#grid.stale { opacity: .45; }
#grid.fresh { animation: rise .45s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
section { margin-top: 30px; }
section.flat { margin-top: 22px; }
.sh { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.sh h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.012em; white-space: nowrap; }
.sh h2 span { font-weight: 400; color: var(--muted); }
.sh .where { flex: 1; min-width: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh .n { color: var(--muted); font-size: 12px; }
.row { display: flex; gap: var(--gap); margin-bottom: var(--gap); content-visibility: auto; }
.t { position: relative; flex: none; height: 100%; overflow: hidden; border-radius: 3px; background: var(--tile); cursor: pointer;
  -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.t img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0;
  transition: opacity .35s, filter .25s, transform .6s var(--ease); }
.t img.in { opacity: 1; }
.t:hover img { filter: brightness(1.07); transform: scale(1.012); }
.t .fv { position: absolute; top: 7px; right: 7px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.t .cap { position: absolute; inset: auto 0 0 0; padding: 22px 8px 6px; font-size: 11.5px; font-weight: 500; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.5)); opacity: 0; transition: opacity .2s; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.t:hover .cap { opacity: 1; }
.empty { padding: 96px 0; text-align: center; color: var(--muted); }
.empty h3 { margin: 0 0 6px; color: var(--ink); font-size: 17px; font-weight: 600; letter-spacing: -.015em; }
.empty button { margin-top: 18px; height: 32px; padding: 0 14px; border-radius: 8px; background: var(--inv);
  color: var(--inv-ink); font-weight: 500; font-size: 13.5px; }
#more { height: 1px; }

/* ── popovers ───────────────────────────────────────────────────────── */
.pop { position: fixed; z-index: 30; width: 300px; max-width: calc(100vw - 16px); padding: 6px; border-radius: 12px; background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line), var(--shadow); transform-origin: 20px 0; animation: pop .16s var(--ease); }
.pop.wide { width: 380px; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.seg { display: flex; padding: 2px; border-radius: 8px; background: var(--seg); margin-bottom: 6px; }
.seg button { flex: 1; height: 26px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--muted);
  transition: color .15s, background .15s, box-shadow .15s; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--ink); background: var(--seg-on); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.pop .find { width: 100%; height: 34px; padding: 0 10px; border: 0; outline: 0; background: none;
  border-bottom: 1px solid var(--line); margin-bottom: 6px; font-size: 13.5px; }
.pop .find::placeholder { color: var(--muted); }
.opts { max-height: min(360px, calc(100vh - 220px)); max-height: min(360px, calc(100dvh - 220px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--faint) transparent; }
.opt { width: 100%; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 8px;
  padding: 7px 10px 7px 8px; border-radius: 7px; text-align: left; font-size: 13.5px; }
.opt:hover, .opt.cur { background: var(--hover); }
.opt .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .l em { font-style: normal; color: var(--muted); margin-left: 6px; font-size: 12.5px; }
.opt .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.opt .ck { opacity: 0; transform: scale(.6); transition: opacity .12s, transform .2s var(--ease); }
.opt.on .ck { opacity: 1; transform: none; }
.opt.on .l { font-weight: 500; }
.opt.zero { opacity: .45; }
.opt.trip { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; padding: 6px 10px 6px 6px; }
.opt.trip img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: var(--tile); }
.opt.trip .l { display: block; }
.opt.trip small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; font-variant-numeric: tabular-nums; }
.opt.sug { grid-template-columns: 16px minmax(0, 1fr) auto; }
.opt.sug svg { color: var(--muted); }
.opt.sug .n { font-size: 11.5px; }
.cap2 { padding: 8px 10px 5px; font-size: 11px; font-weight: 500; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.none { padding: 18px 10px; color: var(--muted); font-size: 13px; text-align: center; }
.set { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 8px 10px; font-size: 13.5px; }
.set .seg { margin: 0; width: 132px; }
.sw { width: 34px; height: 20px; border-radius: 10px; background: var(--faint); position: relative; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .22s var(--ease); }
.sw.on { background: var(--ink); }
.sw.on::after { transform: translateX(14px); background: var(--bg); }

/* ── viewer ─────────────────────────────────────────────────────────── */
.v { position: fixed; inset: 0; z-index: 50; display: none; overflow: hidden; color: #ececed; --vline: rgba(255,255,255,.09); --vmuted: #85858c; }
.v.on { display: block; }
.v-bg { position: absolute; inset: 0; background: #060607; }
.v-stage { position: absolute; inset: 0; pointer-events: none; will-change: transform; }   /* the photo and its neighbours, a page apart */
.v-pic { position: absolute; left: 0; top: 0; pointer-events: auto; border-radius: 2px; overflow: hidden; background: #111; transform-origin: 0 0;
  will-change: transform; }
.v-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.v-pic .hi { opacity: 0; }                          /* fades in; goes at once, so an emptied one never shows */
.v-pic .hi.in { opacity: 1; transition: opacity .3s; }
.v-ui { position: absolute; inset: 0; pointer-events: none; transition: opacity .25s; }
.v-ui > * { pointer-events: auto; }
.v-btn { position: absolute; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  color: #d9d9dc; background: rgba(255,255,255,.07); transition: background .15s, color .15s, opacity .2s, transform .2s var(--ease); }
.v-btn:hover { background: rgba(255,255,255,.15); color: #fff; }
.v-btn:active { transform: scale(.94); }
#vClose { top: 18px; left: 18px; }
#vInfoBtn { top: 18px; right: 18px; transition: right .3s var(--ease), background .15s; }
.v.info #vInfoBtn { right: 378px; background: rgba(255,255,255,.16); color: #fff; }
#vPrev { left: 18px; top: 50%; margin-top: -19px; }
#vNext { right: 18px; top: 50%; margin-top: -19px; transition: right .3s var(--ease), background .15s, opacity .2s; }
.v.info #vNext { right: 378px; }
.v-btn[disabled] { opacity: 0; pointer-events: none; }
.v-count { position: absolute; top: 28px; left: 70px; font-size: 12.5px; color: var(--vmuted); font-variant-numeric: tabular-nums; }
.v-title { display: none; }
.v-info { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; padding: 30px 28px 40px; overflow-y: auto;
  background: #101012; box-shadow: -1px 0 0 var(--vline); transform: translateX(100%); transition: transform .3s var(--ease);
  scrollbar-width: thin; scrollbar-color: #3a3a40 transparent; font-size: 13.5px; overscroll-behavior: contain; }
.v.info .v-info { transform: none; }
.v-info h3 { margin: 0; font-size: 19px; line-height: 1.25; font-weight: 600; letter-spacing: -.02em; color: #fff; }
.v-info .sub { margin-top: 4px; color: var(--vmuted); }
.v-info h4 { margin: 26px 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--vmuted); }
.v-info .big { font-size: 15px; font-weight: 500; color: #fff; }
.v-info .dim { color: var(--vmuted); }
.v-info a, .lnk { color: inherit; text-decoration: none; cursor: pointer; background: linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat;
  background-size: 0 1px; transition: background-size .25s var(--ease); }
.v-info a:hover, .lnk:hover { background-size: 100% 1px; }
.go { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 9px 12px;
  margin-top: 6px; border-radius: 9px; background: rgba(255,255,255,.05); text-align: left; transition: background .15s; }
.go:hover { background: rgba(255,255,255,.1); }
.go span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; font-weight: 500; }
.go small { color: var(--vmuted); font-size: 12px; font-weight: 400; margin-left: 8px; font-variant-numeric: tabular-nums; }
.go svg { color: var(--vmuted); transition: transform .2s var(--ease); }
.go:hover svg { transform: translateX(2px); color: #fff; }
.exp { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 12px; border-radius: 9px;
  box-shadow: inset 0 0 0 1px var(--vline); }
.exp div { padding: 10px 0 9px; text-align: center; }
.exp div + div { box-shadow: -1px 0 0 var(--vline); }
.exp b { display: block; font-size: 14px; font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; }
.exp small { display: block; margin-top: 2px; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--vmuted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { height: 26px; padding: 0 10px; border-radius: 7px; background: rgba(255,255,255,.07); color: #ececed;
  font-size: 12.5px; font-weight: 500; transition: background .15s; }
.tag:hover { background: rgba(255,255,255,.14); }
.v-info .path { margin-top: 4px; font: 11px/1.5 var(--mono); color: var(--vmuted); word-break: break-all; letter-spacing: 0; }
.v-info .cta { margin-top: 28px; width: 100%; height: 36px; border-radius: 9px; background: #ececed; color: #0c0c0d;
  font-weight: 600; font-size: 13.5px; transition: background .15s, transform .2s var(--ease); }
.v-info .cta:hover { background: #fff; }
.v-info .cta:active { transform: scale(.985); }

@media (max-width: 1100px) {      /* search and view options share the first row; filters get their own */
  .search { order: 0; flex: 1 1 0; min-width: 0; max-width: none; }
  .tools { order: 1; margin-left: 0; }
  .pills { order: 2; flex: 1 0 100%; min-width: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-top: 4px;
    overscroll-behavior-x: contain; }
  .pills::-webkit-scrollbar { display: none; }
}
@media (max-width: 760px) {
  :root { --pad: 14px; --gap: 3px; }
  .search kbd { display: none; }
  .head { flex-wrap: wrap; gap: 4px 16px; }           /* a long title pushes Sort / Clear onto their own line */
  .head > div:first-child { flex: 1 1 180px; max-width: 100%; }
  .head-r { margin-left: auto; }
  .head h1 { font-size: 22px; }
}
/* ── phone: notch and home bar (insets are 0 in a normal browser tab), touch ── */
header { padding-top: calc(16px + env(safe-area-inset-top)); padding-left: calc(var(--pad) + env(safe-area-inset-left));
  padding-right: calc(var(--pad) + env(safe-area-inset-right)); }
main { padding-left: calc(var(--pad) + env(safe-area-inset-left)); padding-right: calc(var(--pad) + env(safe-area-inset-right));
  padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
#vClose, #vInfoBtn, #vShare { top: calc(18px + env(safe-area-inset-top)); }
#vClose { left: calc(18px + env(safe-area-inset-left)); }
.v-count { top: calc(28px + env(safe-area-inset-top)); left: calc(70px + env(safe-area-inset-left));
  max-width: calc(100% - 190px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.v.info .v-count { max-width: calc(100% - 550px); }

    const x = W / 2 + (i - pos) * STEP - TW / 2 + (i > c ? side : i < c ? -side : -(cw - TW) / 2);
    el.style.width = (i === c ? cw : TW) + "px"; el.style.transform = `translateX(${x}px)`;
  }
}
function scrubTo(pos) {
  pos = scrub.pos = Math.max(0, Math.min(items.length - 1, pos));
  const i = Math.round(pos);
  if (i !== vCur) { show(i); clearTimeout(scrubT); scrubT = setTimeout(() => { if (scrub && cur.r && !cur.asked) preview(cur); }, 180); }
  drawStrip(pos, false);
  return pos;
}
function scrubStop() {                               // back to rest: the photo sharpens, its neighbours load
  cancelAnimationFrame(coastId); clearTimeout(scrubT);
  const was = scrub; scrub = null; quick = false; strip.classList.remove("drag");
  if (was && vCur >= 0) { arrange(); drawStrip(); }
}
strip.addEventListener("pointerdown", e => {
  if (vCur < 0 || e.button) return;
  if (settle) settle();
  cancelAnimationFrame(coastId);                     // a touch stops a strip that is still coasting
  scrub = { id: e.pointerId, x0: e.clientX, p0: scrub ? scrub.pos : vCur, pos: scrub ? scrub.pos : vCur, moved: !!scrub,
    lx: e.clientX, lt: e.timeStamp, vx: 0, tap: e.target.dataset.i };
  strip.setPointerCapture(e.pointerId);
});
strip.addEventListener("pointermove", e => {
  if (!scrub || e.pointerId !== scrub.id) return;
  const dx = e.clientX - scrub.x0;
  if (!scrub.moved) { if (Math.abs(dx) < 5) return; scrub.moved = true; }
  quick = true; strip.classList.add("drag");
  const dt = e.timeStamp - scrub.lt;
  if (dt > 0) { scrub.vx = .7 * (e.clientX - scrub.lx) / dt + .3 * scrub.vx; scrub.lx = e.clientX; scrub.lt = e.timeStamp; }
  scrubTo(scrub.p0 - dx / STEP);
});
function scrubEnd(e) {
  if (!scrub || e.pointerId !== scrub.id) return;
  if (!scrub.moved) { const i = scrub.tap; scrub = null; if (i != null && +i !== vCur && items[+i]) show(+i); return; }
  let vx = e.timeStamp - scrub.lt > 80 ? 0 : scrub.vx, last = performance.now();   // px per ms as the finger left
  scrub.id = -1;
  const tick = now => {
    const dt = Math.min(40, now - last); last = now;
    const p = scrubTo(scrub.pos - vx * dt / STEP);
    vx *= Math.pow(.95, dt / 16);
    if (Math.abs(vx) > .04 && p > 0 && p < items.length - 1) coastId = requestAnimationFrame(tick); else scrubStop();
  };
  if (Math.abs(vx) > .2) coastId = requestAnimationFrame(tick); else scrubStop();
}
strip.addEventListener("pointerup", scrubEnd);
strip.addEventListener("pointercancel", scrubEnd);

/* ── save / share: the original file, so Save to Photos keeps its date and place ── */
let shareFile = null;                                // fetched for the current photo, waiting for a second tap
async function share() {
  const r = items[vCur], btn = $("#vShare");
  if (!r) return;
  if (shareFile?.sha !== r.sha) logEvent("share", vCur);   // once per photo, not on the second tap
  const name = (r.path || "").split("/").pop() || r.sha.slice(0, 12) + (r.ext || ".jpg");
  if (!navigator.canShare) {                         // desktop browsers: just download it
    const a = document.createElement("a"); a.href = "/original/" + r.sha; a.download = name; a.click(); return;
  }
  if (shareFile?.sha === r.sha) return doShare(shareFile.file);
  btn.classList.add("busy");
  try {
    let res = await fetch("/original/" + r.sha);
    let file = res.ok && new File([await res.blob()], name, { type: res.headers.get("Content-Type") });
    if (!file || !navigator.canShare({ files: [file] })) {   // RAW, or a type the phone won't share: the large JPEG
      res = await fetch("/large/" + r.sha);
      file = new File([await res.blob()], name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
    }
    if (items[vCur] !== r) return;
    shareFile = { sha: r.sha, file };
    await doShare(file);
  } catch (e) {
    if (items[vCur] === r) { vNote = "couldn’t load the photo"; vChrome(); }
  } finally { btn.classList.remove("busy"); }
}
async function doShare(file) {
  const btn = $("#vShare");
  try { await navigator.share({ files: [file] }); btn.classList.remove("ready"); }
  catch (e) {
    // Safari only opens the share sheet straight from a tap; if the download took too long, ask for one more tap
    if (e.name === "NotAllowedError") btn.classList.add("ready");
  }
}
$("#vShare").onclick = share;

/* ── page events ───────────────────────────────────────────────────── */
$("#grid").addEventListener("click", e => { const t = e.target.closest(".t"); if (t) openViewer(+t.dataset.i); });
document.addEventListener("click", e => {
  if (e.target.closest("#clearAll")) { S = blank(); $("#q").value = ""; refresh(); }
  if (e.target.closest("#sortBtn")) { S.sort = D.sort === "old" ? "new" : "old"; refresh(); }
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (vCur >= 0) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); step(1); }
    else if (e.key === "i") toggleInfo();
    return;
  }
  if (e.key === "Escape" && pop) { closePop(); return; }
  if (typing) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  if (e.key === "Enter" && document.activeElement.classList.contains("t")) openViewer(+document.activeElement.dataset.i);
});
addEventListener("popstate", () => {
  if (vBack) { vBack = false; return; }             // the viewer closed itself and took its entry back
  if (vHist) { vHist = false; return closeViewer(); }   // Back, or a swipe from the screen edge, closes the photo
  if (history.state?.v) return history.back();      // the entry left by a photo that is no longer open: step over it
  closeViewer(true); document.documentElement.classList.toggle("deep", depth() > 0);
  const to = fromParams(new URLSearchParams(location.search));
  if (items.length && String(toParams(to)) === String(toParams(S))) return;   // already showing this search
  S = to; $("#q").value = S.q; refresh(false); });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});   // the "can't reach" page
(async function init() {
  F = await getJSON("/api/info");                 // unfiltered counts double as the first facet state
  INFO = { ...F, months: F.months.length };
  S =fromParams(new URLSearchParams(location.search));
  $("#q").value = S.q;
  buildVocab(); buildTimeline(); renderTimeline();
  refresh(false);
})();
</script>
