<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Members — Photo Estate</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)">
<style>
/*@estate.css*/
main { padding: 12px calc(var(--pad) + env(safe-area-inset-right)) 120px calc(var(--pad) + env(safe-area-inset-left)); max-width: 980px; margin: 0 auto; }
.sub { margin: 8px 0 0; max-width: 72ch; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--well-2); color: var(--ink-2); letter-spacing: 0; white-space: nowrap; }
.pill.pending { background: var(--sun-wash); color: var(--sun); }
.pill.revoked { color: var(--muted); }
.list { display: grid; gap: 10px; margin-top: 26px; }
.who { padding: 18px 20px; border-radius: var(--r); background: var(--well); transition: opacity .15s; }
.who.revoked { opacity: .72; }
.who.busy { opacity: .5; pointer-events: none; }
.who .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who h3 { font-size: 20px; font-weight: 700; letter-spacing: -.018em; margin-right: 2px; }
.who .you { font-size: 13px; color: var(--muted); font-weight: 600; }
.who .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.who .acts .btn { height: 32px; padding: 0 14px; font-size: 13.5px; }
.who .logins { margin-top: 4px; color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.who .logins b { color: var(--ink-2); font-weight: 600; }
.ctl { display: flex; gap: 12px 18px; flex-wrap: wrap; margin-top: 14px; }
.ctl label { display: grid; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ctl select, .ctl input { height: 34px; padding: 0 12px; border-radius: 999px; border: 0; outline: 0; background: var(--well-2);
  font: 14px var(--sans); color: var(--ink); letter-spacing: 0; text-transform: none; min-width: 150px; }
.ctl select:focus, .ctl input:focus { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2), 0 0 0 4px var(--sun-wash); }
.ctl select:disabled { opacity: .55; }
.who.agent .what { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 72ch; }
.pill.agent { background: var(--well-2); color: var(--ink-2); }
.note { margin-top: 30px; font-size: 13.5px; max-width: 72ch; }
@media (max-width: 760px) { .who .acts { margin-left: 0; width: 100%; } .ctl label, .ctl select, .ctl input { width: 100%; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="round" href="/" aria-label="Back"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></a>
  <div class="crumb">Members</div>
  <div class="end num" id="sum"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script type="module">
import { $, esc, MARK } from "/app/dom.js";
import { plural } from "/app/format.js";
import { api } from "/app/api.js";
import { membersFlow, actions, STATUS } from "/app/members-flow.js";
import { toast } from "/app/toast.js";

const ROLE = { sysadmin: "Sysadmin", member: "Member" };
const POLICY = { everything: "Shares everything", review: "Reviews each batch", review_flagged: "Reviews what may be private" };
const day = when => when ? new Date(when).toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" }) : "";
const options = (values, names, chosen) => values.map(v => `<option value="${esc(v)}"${v === chosen ? " selected" : ""}>${esc(names[v] || v)}</option>`).join("");

const members = membersFlow({
  list: signal => api("/api/members", undefined, { signal }),
  save: (id, fields) => api(`/api/members/${id}`, fields),
  onChange: () => draw(),
});

// The estate's agent is a member (members.py), but no person: it has no login, no role to give and nothing to change
// here, so it is shown as what it is.
const agentRow = m => `<div class="who agent" data-agent="${m.id}"><div class="head"><h3>${esc(m.name)}</h3><span class="pill agent">Agent</span></div>
  <p class="what">It runs on this computer when a member asks it something, or when new photos may belong in a family series. Working for a member, it sees what they see and what it makes is theirs; for the family, it sees only what everyone can see and publishes family series. It is not changed here.</p></div>`;

function row(m, d) {
  if (m.kind === "agent") return agentRow(m);
  const busy = members.page.is("saving") && members.page.data.id === m.id;
  const persons = d.persons.length
    ? `<option value="">Nobody linked</option>${d.persons.map(p => `<option value="${p.id}"${p.id === m.person_id ? " selected" : ""}>${esc(p.name)}</option>`).join("")}`
    : `<option value="">No one named in People yet</option>`;
  const login = m.logins[0]?.login;
  return `<div class="who ${m.status}${busy ? " busy" : ""}" data-id="${m.id}">
    <div class="head"><h3>${esc(m.name)}</h3>${m.id === d.me ? `<span class="you">You</span>` : ""}
      ${m.status === "active" ? "" : `<span class="pill ${m.status}">${esc(STATUS[m.status] || m.status)}</span>`}
      <div class="acts">${actions(m).map((a, i) => `<button class="btn${a.primary ? " pri" : ""}" data-act="${i}">${esc(a.label)}</button>`).join("")}
        ${d.demo && login && m.status === "active" && m.id !== d.me ? `<a class="btn ask" href="/members?be=${encodeURIComponent(login)}">Be ${esc(m.name)}</a>` : ""}</div></div>
    <p class="logins">${m.logins.map(l => `<b>${esc(l.login)}</b>`).join(", ") || "No login"}${m.joined_at ? ` · let in ${day(m.joined_at)}` : m.logins[0] ? ` · asked ${day(m.logins[0].added_at)}` : ""}</p>
    <div class="ctl">
      <label>Name <input type="text" data-f="name" value="${esc(m.name)}" maxlength="80"></label>
      <label>Role <select data-f="role">${options(d.roles, ROLE, m.role)}</select></label>
      <label>Uploads <select data-f="upload_policy">${options(d.policies, POLICY, m.upload_policy)}</select></label>
      <label>In photos <select data-f="person_id"${d.persons.length ? "" : " disabled"}>${persons}</select></label>
    </div></div>`;
}

function draw() {
  const p = members.page;
  if (p.is("idle", "loading") && !$("#main").childElementCount) {
    $("#main").innerHTML = `<div class="blank">${MARK}<h3>Finding everyone</h3></div>`;
    return;
  }
  if (p.is("failed")) {
    $("#main").innerHTML = `<div class="blank">${MARK}<h3>The members could not be read</h3><p>${esc(p.data.error?.message || "")}</p>
      <button class="btn" id="again">Try again</button></div>`;
    $("#again").onclick = () => members.load();
    return;
  }
  if (!p.is("ready", "saving")) return;
  const d = p.data, waiting = d.members.filter(m => m.status === "pending").length;
  $("#sum").innerHTML = waiting ? `<b>${plural(waiting, "person", "people")} asking</b>` : plural(d.members.filter(m => m.status === "active" && m.kind !== "agent").length, "member");
  $("#main").innerHTML = `<h1 class="display">Members</h1>
    <p class="sub">Who may use this library. Someone new asks from the page they see when they first open it, and waits here until you let them in. A member is never removed: turning one off keeps who they were.</p>
    <div class="list" id="list">${d.members.map(m => row(m, d)).join("")}</div>
    <p class="note sub">Uploads is what the iPhone app will ask before it shares a member's photos; it does nothing yet. In photos links a member to a person named in People.${d.demo ? " This is the demo: <b>Be</b> a member to see the library as them; their own page sends you back." : ""}</p>`;
}

$("#main").addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"), card = e.target.closest("[data-id]");
  if (!b || !card || !members.page.is("ready")) return;
  const m = members.page.data.members.find(x => x.id === +card.dataset.id), a = actions(m)[+b.dataset.act];
  const got = await members.change(m.id, a.fields);
  toast(got.ok ? `${got.member.name} is ${STATUS[got.member.status].toLowerCase()}` : got.error.message);
});
$("#main").addEventListener("change", async e => {
  const el = e.target.closest("[data-f]"), card = e.target.closest("[data-id]");
  if (!el || !card) return;
  const f = el.dataset.f, value = f === "person_id" ? (el.value ? +el.value : null) : el.value.trim();
  const got = await members.change(+card.dataset.id, { [f]: value });
  if (!got.ok) { toast(got.error.message); draw(); }
  else toast(`${got.member.name} saved`);
});

draw();
members.load();
</script>
</body>
</html>
