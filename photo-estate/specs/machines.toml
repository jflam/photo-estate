[[machine]]
name = "who each face is, and the clustering of unnamed faces"
tables = ["faces", "persons", "face_not", "face_later"]
enums = ["ClusterState"]
writers = ["faces.py"]
checked = "model"
model = "People.tla"
# (the catalog's names and the People page's memory of them, a load of People beside the one answering, a member's
# change, a group named from the page, and what People is built without against the looks. ClusterState has one
# writer, each People's own clustering thread, which writes it three times in order (People.cluster): no table of
# moves. faces.py run writes faces and face_scans from a process of its own, and only adds; estate.py purge deletes a
# photo's rows with SQL the writers' search does not see (f-strings), by hand, with a restart after it)
code = { "faces.py" = ["default_hidden", "face_rows", "People.__init__", "People.load", "People.decisions", "People.refresh", "People.replaced_by", "People.rescore", "People.seed", "People.cluster", "People.find_clusters", "People.recluster", "People.key", "People.rescored", "People.unknown", "People.commit", "People.label", "People.label_many", "People.decide", "People.edit_person", "People.handle"], "photo_app.py" = ["PhotoApp.load_people", "PhotoApp.load_people_once", "PhotoApp.mend", "PhotoApp.people_page", "PhotoApp.people_out", "PhotoApp.private_write", "PhotoApp.relook", "PhotoApp.hidden_changed", "PhotoApp.reload_catalog"], "lenses.py" = ["State.people_out"] }
