<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="A technical book about Photo Estate: gathering every photo from Google, iCloud, Flickr and your phone onto your own disk, and searching it by what is in it.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141311'/%3E%3Ccircle cx='16' cy='19' r='6' fill='%23ffb061'/%3E%3Cpath d='M0 26 Q10 14 20 24 T32 20 V32 H0Z' fill='%23332f27'/%3E%3C/svg%3E">
<script>
  // Set the theme before anything paints, so a dark-mode reader never sees a white flash.
  (function () {
    var t = null;
    try { t = localStorage.getItem("book-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="assets/book.css">
</head>
<body class="{{bodyclass}}">
<a class="skip" href="#content">Skip to the text</a>

<header class="bar">
  <button class="icon menu" type="button" aria-label="Chapters" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="index.html"><span class="sun" aria-hidden="true"></span>Photo Estate <em>how it works</em></a>
  <button class="icon theme" type="button" aria-label="Switch between light and dark">
    <svg class="i-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="i-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>

<div class="shell">
  <aside id="sidebar" class="sidebar">
    <div class="search">
      <input id="q" type="search" placeholder="Search the book" autocomplete="off" spellcheck="false" aria-label="Search the book">
      <kbd>/</kbd>
      <div id="results" class="results" hidden></div>
    </div>
    <nav aria-label="Chapters">
{{nav}}
    </nav>
    <p class="side-foot"><a href="{{repo}}">Source on GitHub</a></p>
  </aside>
  <div class="scrim" hidden></div>

  <main id="content" class="content">
    <article>
      <header class="title">
        <p class="eyebrow">{{eyebrow}}</p>
        <h1>{{heading}}</h1>
{{cta}}
      </header>
      <div class="prose">
{{body}}
      </div>
      <nav class="pager" aria-label="Chapter navigation">{{pager}}</nav>
      <footer class="foot">
        <a href="{{source}}">Edit this page on GitHub</a>
        <span>·</span>
        <a href="{{repo}}">Photo Estate</a>
      </footer>
    </article>
    <aside class="toc" aria-label="On this page">
      <h2>On this page</h2>
      <ul>{{toc}}</ul>
    </aside>
  </main>
</div>

<script type="module" src="assets/book.js"></script>
</body>
</html>
