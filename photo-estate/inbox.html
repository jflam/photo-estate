<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inbox — Photo Estate</title>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)">
<style>
/*@estate.css*/
main { padding: 12px calc(var(--pad) + env(safe-area-inset-right)) 120px calc(var(--pad) + env(safe-area-inset-left)); max-width: 980px; margin: 0 auto; }
.sub { margin: 8px 0 0; max-width: 72ch; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--sun-wash); color: var(--sun); letter-spacing: 0; white-space: nowrap; }
.pill.lens_changed { background: var(--well-2); color: var(--ink-2); }
.list { display: grid; gap: 10px; margin-top: 26px; }
.item { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; padding: 18px 20px; border-radius: var(--r); background: var(--well); transition: opacity .15s; }
.item.busy { opacity: .5; pointer-events: none; }
.item .what { flex: 1; min-width: 0; }
.item h3 { margin-top: 6px; font-size: 18px; font-weight: 600; letter-spacing: -.012em; overflow-wrap: anywhere; }
.item .when { margin-top: 2px; color: var(--muted); font-size: 13.5px; }
.item .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.item .acts .btn { height: 32px; padding: 0 14px; font-size: 13.5px; }
@media (max-width: 760px) { .item .acts { width: 100%; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="round" href="/" aria-label="Back"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></a>
  <div class="crumb">Inbox</div>
  <div class="end num" id="sum"></div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script type="module">
import { $, esc, MARK } from "/app/dom.js";
import { plural } from "/app/format.js";
import { api } from "/app/api.js";
import { inboxFlow, act, KIND } from "/app/inbox-flow.js";
import { day } from "/app/lens-flow.js";
import { toast } from "/app/toast.js";

const inbox = inboxFlow({
  list: signal => api("/api/inbox", undefined, { signal }),
  dismiss: id => api(`/api/inbox/${id}/dismiss`, {}),
  onChange: () => draw(),
});

function card(x) {
  const p = inbox.page, busy = p.is("dismissing") && p.data.id === x.id, a = act(x);
  return `<div class="item${busy ? " busy" : ""}" data-id="${x.id}">
    <div class="what"><span class="pill ${esc(x.kind)}">${esc(KIND[x.kind] || x.kind)}</span><h3>${esc(x.title)}</h3>
      <p class="when">${esc(day(x.updated_at || x.created_at))}</p></div>
    <div class="acts">${x.opens ? `<a class="btn pri" href="${esc(x.opens)}" data-open="${a.notice ? 1 : 0}">${esc(a.label)}</a>` : ""}
      <button class="btn" data-dismiss>Dismiss</button></div></div>`;
}

function draw() {
  const p = inbox.page;
  if (p.is("idle", "loading") && !$("#main").childElementCount) {
    $("#main").innerHTML = `<div class="blank">${MARK}<h3>Looking</h3></div>`;
    return;
  }
  if (p.is("failed")) {
    $("#main").innerHTML = `<div class="blank">${MARK}<h3>The inbox could not be read</h3><p>${esc(p.data.error?.message || "")}</p>
      <button class="btn" id="again">Try again</button></div>`;
    return;
  }
  if (!p.is("ready", "dismissing")) return;
  const d = p.data;
  $("#sum").innerHTML = d.open ? `<b>${plural(d.open, "thing")} to decide</b>` : "";
  $("#main").innerHTML = `<h1 class="display">Inbox</h1>
    <p class="sub">What waits for you. Each opens the page where it is decided, and deciding it there takes it out of here.</p>`
    + (d.items.length ? `<div class="list" id="list">${d.items.map(card).join("")}</div>`
      : `<div class="blank">${MARK}<h3>Nothing to decide</h3><p>Someone asking to be let in, a filter proposed as an estate default, a lens you follow that changes, photos an agent proposes for you to look over: each comes here.</p></div>`);
}

$("#main").addEventListener("click", async e => {
  if (e.target.closest("#again")) return inbox.load();
  const card = e.target.closest("[data-id]");
  if (!card || !inbox.page.is("ready")) return;
  const id = +card.dataset.id, open = e.target.closest("[data-open]");
  if (open) {
    if (open.dataset.open !== "1") return;            // decided where it opens: it stays here until then
    e.preventDefault();                               // a notice: seeing it is all it asks, so it is put away first
    await inbox.dismiss(id);
    location.href = open.getAttribute("href");
    return;
  }
  if (!e.target.closest("[data-dismiss]")) return;
  const got = await inbox.dismiss(id);
  toast(got.ok ? "Put away" : got.error.message);
});

draw();
inbox.load();
</script>
</body>
</html>
